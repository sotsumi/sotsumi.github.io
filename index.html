<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Random Reddit Saved Posts</title>

    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f1115;
            margin: 0;
            padding: 2rem;
            color: #e6e6e6;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #181b20;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.4);
        }
        
        h1 {
            margin-top: 0;
            font-size: 1.4rem;
            color: #f2f2f2;
        }
        
        p {
            color: #a8adb7;
            margin-bottom: 1rem;
        }
        
        #load {
            width: 100%;
            padding: 0.6rem;
            font-size: 1rem;
            background: #3a8fd8;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        #load:hover {
            background: #5aa3e6;
        }
        
        #results {
            margin-top: 1.5rem;
        }
        
        .post {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            padding: 0.5rem 0.75rem;
            border: 1px solid #2b3038;
            border-radius: 4px;
            margin-bottom: 0.5rem;
            background: #20242b;
        }
        
        .post span {
            font-size: 0.9rem;
            color: #d7dce5;
        }
        
        .post button {
            background: transparent;
            border: 1px solid #3a8fd8;
            color: #7bbcff;
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .post button:hover {
            background: #3a8fd8;
            color: white;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Random Reddit Saved Posts</h1>
        <p>Click the button to open ten randomly selected saved posts.</p>

        <button id="load">Get 10 random posts</button>

        <div id="results"></div>
    </div>

    <script>
        const loadButton = document.getElementById('load');
        const container = document.getElementById('results');

        loadButton.addEventListener('click', () => {
            fetch('data.csv')
                .then(r => r.text())
                .then(text => {
                    container.innerHTML = '';

                    const lines = text.trim().split('\n');
                    const rows = lines.slice(1).map(line => line.split(','));

                    rows.sort(() => Math.random() - 0.5);

                    rows.slice(0, 10).forEach(row => {
                        const id = row[0].slice(1).slice(0, -1);
                        const subreddit = row[3].slice(1).slice(0, -1);
                        const title = row[5].slice(1).slice(0, -1);
                        const url = `https://www.reddit.com/r/${subreddit}/comments/${id}`;

                        const wrapper = document.createElement('div');
                        wrapper.className = 'post';

                        const label = document.createElement('span');
                        label.textContent = `r/${subreddit}: ${title}`;

                        const button = document.createElement('button');
                        button.textContent = 'Open';
                        button.onclick = () => window.open(url, '_blank');

                        wrapper.appendChild(label);
                        wrapper.appendChild(button);
                        container.appendChild(wrapper);
                    });
                });
        });
    </script>
</body>
</html>
