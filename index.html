<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Reddit Saved Posts</title>

    <style>
        * {
            box-sizing: border-box;
        }
    
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f1115;
            margin: 0;
            padding: 1.25rem;
            color: #e6e6e6;
        }
    
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background: #181b20;
            padding: 1.25rem;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.4);
        }
    
        h1 {
            margin-top: 0;
            font-size: clamp(1.35rem, 4vw, 1.55rem);
            line-height: 1.15;
            color: #f2f2f2;
        }
    
        p {
            color: #a8adb7;
            margin-bottom: 1rem;
            font-size: 0.95rem;
            line-height: 1.4;
        }
    
        #load {
            width: 100%;
            padding: 0.85rem;
            font-size: 1rem;
            background: #3a8fd8;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    
        #load:hover {
            background: #5aa3e6;
        }
    
        #results {
            margin-top: 1.5rem;
        }
    
        .post {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.75rem;
            padding: 0.75rem;
            border: 1px solid #2b3038;
            border-radius: 6px;
            margin-bottom: 0.75rem;
            background: #20242b;
        }
    
        .post span {
            flex: 1;
            min-width: 0;
            font-size: 0.9rem;
            line-height: 1.35;
            color: #d7dce5;
            overflow-wrap: anywhere;
        }
    
        .post button {
            flex-shrink: 0;
            background: transparent;
            border: 1px solid #3a8fd8;
            color: #7bbcff;
            padding: 0.4rem 0.65rem;
            border-radius: 4px;
            cursor: pointer;
        }
    
        .post button:hover {
            background: #3a8fd8;
            color: white;
        }
    
        @media (max-width: 480px) {
            body {
                padding: 0;
            }
    
            .container {
                min-height: 100vh;
                padding: 1rem;
                border-radius: 0;
                box-shadow: none;
            }

            h1 {
                font-size: 1.45rem;
            }

            p {
                font-size: 1rem;
            }

            #load {
                padding: 1rem;
                font-size: 1.05rem;
            }
    
            .post {
                flex-direction: column;
                align-items: stretch;
                gap: 0.9rem;
                padding: 1rem;
            }

            .post span {
                font-size: 1rem;
                line-height: 1.45;
            }
    
            .post button {
                width: 100%;
                padding: 0.85rem;
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Random Reddit Saved Posts</h1>
        <p>Click the button to open ten randomly selected saved posts.</p>

        <button id="load">Get 10 random posts</button>

        <div id="results"></div>
    </div>

    <script>
        const loadButton = document.getElementById('load');
        const container = document.getElementById('results');

        loadButton.addEventListener('click', () => {
            fetch('data.csv')
                .then(r => r.text())
                .then(text => {
                    container.innerHTML = '';

                    const lines = text.trim().split('\n');
                    const rows = lines.slice(1).map(line => line.split(','));

                    rows.sort(() => Math.random() - 0.5);

                    rows.slice(0, 10).forEach(row => {
                        const id = row[0].slice(1).slice(0, -1);
                        const subreddit = row[3].slice(1).slice(0, -1);
                        const title = row[5].slice(1).slice(0, -1);
                        const url = `https://www.reddit.com/r/${subreddit}/comments/${id}`;

                        const wrapper = document.createElement('div');
                        wrapper.className = 'post';

                        const label = document.createElement('span');
                        label.textContent = `r/${subreddit}: ${title}`;

                        const button = document.createElement('button');
                        button.textContent = 'Open';
                        button.onclick = () => window.open(url, '_blank');

                        wrapper.appendChild(label);
                        wrapper.appendChild(button);
                        container.appendChild(wrapper);
                    });
                });
        });
    </script>
</body>
</html>
